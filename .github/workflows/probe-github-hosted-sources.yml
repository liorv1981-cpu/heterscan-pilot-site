name: HETERSCAN GitHub-hosted source probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - name: Install worker
        run: python -m pip install ./worker
      - name: Probe municipal sources from GitHub-hosted IP
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time

          from heterscan.adapters.complot import ComplotAdapter
          from heterscan.adapters.jerusalem import JerusalemAdapter


          def probe_complot(city_id: str, city_name: str, site_id: str) -> dict:
              adapter = ComplotAdapter(
                  city_id,
                  city_name,
                  {
                      "site_id": site_id,
                      "locality_code": city_id,
                      "timeout_seconds": 30,
                      "max_parallelism": 1,
                      "initial_requests_per_second": 1,
                      "target_requests_per_second": 1,
                  },
              )
              started = time.monotonic()
              try:
                  response = adapter.client.request("GET", adapter._list_url("101"), attempts=1)
                  rows = adapter._list_rows(response.text)
                  return {
                      "source": "complot",
                      "city": city_name,
                      "status": response.status_code,
                      "bytes": len(response.content),
                      "rows": len(rows),
                      "elapsed_seconds": round(time.monotonic() - started, 2),
                  }
              finally:
                  adapter.close()


          def probe_jerusalem() -> dict:
              adapter = JerusalemAdapter("3000", "ירושלים", {})
              started = time.monotonic()
              try:
                  rows = adapter._call(
                      adapter.client,
                      242700437,
                      {
                          "misparTik": None,
                          "gush": None,
                          "helka": None,
                          "rehovCode": "16700100",
                          "mispBait": None,
                          "mezahe": None,
                          "migrash": None,
                          "systemId": adapter.system_id,
                      },
                  )
                  return {
                      "source": "jerusalem",
                      "city": "ירושלים",
                      "status": 200,
                      "rows": len(rows),
                      "elapsed_seconds": round(time.monotonic() - started, 2),
                  }
              finally:
                  adapter.close()


          probes = [
              probe_complot("4000", "חיפה", "16"),
              probe_complot("7900", "פתח תקווה", "84"),
              probe_complot("8300", "ראשון לציון", "108"),
              probe_jerusalem(),
          ]
          print(json.dumps(probes, ensure_ascii=False, indent=2))
          if any(item["status"] != 200 or item.get("bytes", 1) < 100 for item in probes):
              raise SystemExit("One or more municipal sources failed the hosted-runner probe")
          PY
