name: HETERSCAN regenerate report

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Supabase run UUID
        required: true
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - name: Install worker
        run: python -m pip install ./worker
      - name: Regenerate report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m heterscan.regenerate_report --run-id "${{ inputs.run_id }}"
