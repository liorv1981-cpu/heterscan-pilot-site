name: Application quality checks
on:
  push:
    paths: ['web/**', 'package*.json', 'worker/**', '.github/workflows/quality.yml']
  pull_request:
    paths: ['web/**', 'package*.json', 'worker/**', '.github/workflows/quality.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install './worker[dev]'
      - run: python -m pytest worker/tests -q
