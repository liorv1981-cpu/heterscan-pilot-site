name: HETERSCAN manual worker

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Supabase run UUID
        required: true
        type: string

concurrency:
  group: heter-scan-pilot-worker
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - name: Install worker
        run: python -m pip install ./worker
      - name: Process run
        id: worker
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_WORKER_SECONDS: "19800"
        run: |
          set +e
          python -m heterscan.runner --run-id "$RUN_ID"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 75 ]; then exit "$code"; fi
      - name: Continue same run after safe checkpoint
        if: steps.worker.outputs.exit_code == '75'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run heter-scan-manual-worker.yml --ref "${{ github.ref_name }}" -f run_id="${{ inputs.run_id }}"
