name: HETERSCAN manual worker
run-name: HETERSCAN ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Supabase run UUID
        required: true
        type: string
      runner_label:
        description: Deprecated compatibility input; all scans run locally
        required: false
        type: string

concurrency:
  group: heter-scan-pilot-worker-local
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  scan:
    runs-on: jerusalem-local
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Install worker on local runner
        shell: powershell
        run: |
          & 'C:\HETERSCAN\Python312\python.exe' -m pip install ./worker
      - name: Process run on local runner
        id: worker_local
        shell: powershell
        env:
          RUN_ID: ${{ inputs.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_WORKER_SECONDS: "19800"
        run: |
          & 'C:\HETERSCAN\Python312\python.exe' -m heterscan.runner --run-id "$env:RUN_ID"
          $code = $LASTEXITCODE
          "exit_code=$code" >> $env:GITHUB_OUTPUT
          if ($code -ne 0 -and $code -ne 75) { exit $code }
      - name: Continue same run after safe checkpoint
        if: steps.worker_local.outputs.exit_code == '75'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run heter-scan-manual-worker.yml --ref "${{ github.ref_name }}" -f run_id="${{ inputs.run_id }}"
