[project]
name = "heterscan-worker"
version = "0.1.0"
description = "Manual HETERSCAN pilot worker"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29",
  "lxml>=6,<7",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-httpx>=0.35,<0.36", "ruff>=0.14,<0.15"]

[project.scripts]
heterscan-worker = "heterscan.runner:main"
heterscan-import = "heterscan.import_workbook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heterscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
